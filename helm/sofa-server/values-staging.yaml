replicaCount: 2

image:
  pullPolicy: Always

ingress:
  host: staging-api.example.com
  tls: true
  tlsSecretName: sofa-server-staging-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false

env:
  DEBUG: "false"
  LOG_LEVEL: "info"
  WORKERS: "4"
  ELASTICSEARCH_HOST: "http://elasticsearch.staging.svc.cluster.local:9200"
  REDIS_HOST: "redis.staging.svc.cluster.local"
  REDIS_PORT: "6379"
